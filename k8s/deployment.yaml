apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocare-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autocare-billing
  template:
    metadata:
      labels:
        app: autocare-billing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: autocare-billing-ghcr
      containers:
        - name: billing
          image: ghcr.io/yxsbx/soat-fiap-autocare-billingonfigure-image
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: autocare-billing-runtime
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
